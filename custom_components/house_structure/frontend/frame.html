<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermal Lab</title>
<!--
  The Thermal Lab page in Home Assistant's sidebar: a tab bar, and a frame that
  shows the chosen tab's own page. House Structure serves it (panel.py); other
  integrations add tabs (tabs.py), and the list arrives over the
  house_structure/tabs subscription, so tabs come and go without a reload.
  The chosen tab is in the address (#key) and remembered.
-->
<style>
  :root {
    --bg: #fafafa; --card: #ffffff; --text: #212121; --muted: #727272;
    --line: #e0e0e0; --accent: #03a9f4; --chip: #eeeeee;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111111; --card: #1c1c1c; --text: #e1e1e1; --muted: #9b9b9b;
      --line: #333333; --chip: #2a2a2a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111111; --card: #1c1c1c; --text: #e1e1e1; --muted: #9b9b9b;
    --line: #333333; --chip: #2a2a2a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }
  nav {
    display: flex; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--line);
    background: var(--card); overflow-x: auto; flex: 0 0 auto; scrollbar-width: thin;
  }
  nav button {
    border: 0; background: none; color: var(--muted); font: inherit; font-weight: 500;
    padding: 12px 14px 10px; cursor: pointer; white-space: nowrap;
    border-bottom: 2px solid transparent;
  }
  nav button:hover { color: var(--text); }
  nav button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  iframe { flex: 1 1 auto; width: 100%; border: 0; display: block; background: var(--bg); }
  .message { margin: 24px auto; max-width: 560px; padding: 0 16px; color: var(--muted); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<nav id="tabs" role="tablist" aria-label="Thermal Lab"></nav>
<p id="message" class="message hidden"></p>
<iframe id="view" title="Thermal Lab tab" class="hidden"></iframe>
<script src="tab.js"></script>
<script>
"use strict";
// A tab page asks for Home Assistant's connection from its parent, as the
// lab's page always has; this frame is that parent now, so pass it on.
try { window.hassConnection = window.parent.hassConnection; } catch (e) { /* not in Home Assistant */ }

const lab = window.thermalLab;
const state = { tabs: [], key: null };

function message(text) {
  const box = document.getElementById("message");
  box.textContent = text || "";
  box.classList.toggle("hidden", !text);
}

function wanted() {
  const fromHash = decodeURIComponent(location.hash.slice(1));
  const keys = state.tabs.map((t) => t.key);
  if (keys.includes(fromHash)) return fromHash;
  if (keys.includes(state.key)) return state.key;
  const saved = lab.recall("tab", null);
  return keys.includes(saved) ? saved : keys[0] || null;
}

function show(key) {
  const tab = state.tabs.find((t) => t.key === key);
  const view = document.getElementById("view");
  state.key = tab ? tab.key : null;
  for (const b of document.querySelectorAll("#tabs button")) {
    const on = b.dataset.key === state.key;
    b.setAttribute("aria-selected", String(on));
    b.tabIndex = on ? 0 : -1;
  }
  if (!tab) {
    view.classList.add("hidden");
    view.removeAttribute("src");
    return;
  }
  lab.remember("tab", tab.key);
  if (location.hash.slice(1) !== tab.key) history.replaceState(null, "", "#" + tab.key);
  // the same address again would reload the tab; only load a different one
  if (view.getAttribute("src") !== tab.url) view.setAttribute("src", tab.url);
  view.classList.remove("hidden");
}

function drawTabs() {
  const nav = document.getElementById("tabs");
  nav.replaceChildren(...state.tabs.map((t) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "tab");
    b.dataset.key = t.key;
    b.textContent = t.title;
    b.addEventListener("click", () => show(t.key));
    return b;
  }));
  message(state.tabs.length ? "" : "No tabs yet.");
  show(wanted());
}

// arrow keys move between tabs, as in any tab list
document.getElementById("tabs").addEventListener("keydown", (e) => {
  const i = state.tabs.findIndex((t) => t.key === state.key);
  if (i < 0 || !["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
  e.preventDefault();
  const n = state.tabs.length;
  const next = e.key === "Home" ? 0 : e.key === "End" ? n - 1
    : (i + (e.key === "ArrowRight" ? 1 : -1) + n) % n;
  show(state.tabs[next].key);
  document.querySelector(`#tabs button[data-key="${state.key}"]`)?.focus();
});
window.addEventListener("hashchange", () => show(wanted()));

async function start() {
  lab.applyTheme();
  try {
    await lab.subscribe((event) => { state.tabs = event.tabs || []; drawTabs(); },
      { type: "house_structure/tabs" });
  } catch (err) {
    message(err && err.message ? err.message : "Could not reach Home Assistant.");
  }
}
start();
</script>
</body>
</html>
