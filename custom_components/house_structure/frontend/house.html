<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House</title>
<!--
  House Structure's own tab on the Thermal Lab page: the house drawn from its
  rooms (or one room on its own), and its heating and cooling equipment and
  detached buildings. Data from house_structure/house; the drawings from
  /api/house_structure/plan.svg and room.svg, put inline so their layers
  (data-layer="rooms", "runs") can be switched and overlays drawn at their
  anchors (data-layer="anchors").

  Overlays come from other integrations (house_structure/overlays). Each has a
  websocket command that answers, in watts (positive into a room):
    {as_of, between: [{from, to, w}], outside: [{room, face, w}],
     heating: [{room, w, register?}], solar: [{room, w}], notes: [...]}
-->
<style>
  :root {
    --bg: #fafafa; --card: #ffffff; --text: #212121; --muted: #727272;
    --line: #e0e0e0; --accent: #03a9f4; --chip: #eeeeee;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111111; --card: #1c1c1c; --text: #e1e1e1; --muted: #9b9b9b;
      --line: #333333; --chip: #2a2a2a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111111; --card: #1c1c1c; --text: #e1e1e1; --muted: #9b9b9b;
    --line: #333333; --chip: #2a2a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h2 {
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 12px;
  }
  h3 { font-size: 15px; font-weight: 500; margin: 0 0 6px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; margin-bottom: 16px; min-width: 0;
  }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .bar .label { color: var(--muted); font-size: 12px; margin-right: 4px; }
  button.chip {
    border: 1px solid var(--line); background: var(--chip); color: var(--text);
    border-radius: 16px; padding: 4px 12px; font: inherit; cursor: pointer;
  }
  button.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .drawing { text-align: center; position: relative; min-height: 120px; }
  /* the drawings are dark lines on white, so they keep a white sheet in dark mode */
  .drawing svg { width: 100%; max-width: 100%; height: auto; background: #fff; border-radius: 8px; }
  /* while a new drawing is being made: the old one fades, and a message says so */
  .drawing.busy svg { opacity: 0.35; transition: opacity 0.15s; }
  .drawing.busy::before {
    content: "Generating drawing…"; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); font-weight: 500;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 16px; }
  .part { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--muted); flex: 0 0 auto; max-width: 50%; }
  .row .v { text-align: right; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  ul.notes { color: var(--muted); font-size: 12px; margin: 8px 0 0; padding-left: 18px; }
  .banner { background: #fff3e0; color: #6d4c00; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <div id="error" class="banner hidden"></div>

  <section class="card">
    <h2>Drawing</h2>
    <div class="bar" id="rooms" role="group" aria-label="Show"></div>
    <div class="bar" id="parts" role="group" aria-label="Floors and buildings"></div>
    <div class="bar" id="turn" role="group" aria-label="View">
      <span class="label">View</span>
      <button class="chip" type="button" data-turn="-1" title="Turn the view a quarter anticlockwise" aria-label="Turn anticlockwise">⟲</button>
      <button class="chip" type="button" data-turn="1" title="Turn the view a quarter clockwise" aria-label="Turn clockwise">⟳</button>
      <button class="chip" type="button" data-topdown="false" aria-pressed="true" title="Draw it in perspective, from one of the four corners">Isometric</button>
      <button class="chip" type="button" data-topdown="true" aria-pressed="false" title="Draw it from straight above, as a plan (more than one floor: drawn apart)">Plan</button>
      <span id="view-name" class="label" aria-live="polite"></span>
    </div>
    <div class="bar" id="floors" role="group" aria-label="Floors">
      <span class="label">Floors</span>
      <button class="chip" type="button" data-exploded="false">Together</button>
      <button class="chip" type="button" data-exploded="true">Apart</button>
    </div>
    <div class="bar" id="layers" role="group" aria-label="Layers"></div>
    <div class="drawing" id="drawing" role="img" aria-label="The house, drawn from its rooms"></div>
    <p class="hint" id="drawing-hint"></p>
    <ul class="notes" id="overlay-notes"></ul>
  </section>

  <section class="card">
    <h2>Heating and cooling</h2>
    <div class="grid" id="equipment"></div>
  </section>

  <section class="card" id="buildings-card">
    <h2>Detached buildings</h2>
    <div class="grid" id="buildings"></div>
  </section>
</main>
<script src="tab.js"></script>
<script>
"use strict";
const lab = window.thermalLab;
const SVG = "http://www.w3.org/2000/svg";
const W_PER_BTUH = 0.29307107;
const W_PER_TON = 12000 * W_PER_BTUH;
const CFM = 0.000471947;  // m³/s
const INWC = 249.089;  // Pa
// overlay colours: on a white sheet in either theme
const COLOURS = { between: "#ef6c00", gain: "#d32f2f", loss: "#1e6fd9", heat: "#d84315", sun: "#f9a825" };
// the corner the drawing looks from, by quarter turns (drawing.py VIEWS)
const VIEWS = ["south-west", "north-west", "north-east", "south-east"];
// from above, the side at the top of the page, by the same quarter turns (drawing.py UP_BY_VIEW)
const UP_BY_VIEW = ["north", "east", "south", "west"];
const state = {
  house: null, room: null, part: null, exploded: false, view: 0,  // part: a floor or building key
  topDown: false,        // drawn from straight above, a plan
  runs: true,            // the heating runs layer
  roofs: false,          // the roofs layer: off, as it hides the rooms
  dims: false,           // the room and wall sizes
  rvalues: false,        // the R-values of the walls and roofs
  links: false,          // the lines between rooms that are linked (a plan's connections layer)
  names: false,          // the rooms' names, on a plan
  positions: false,      // the origin, and where each room with a typed position is, on a plan
  delta: false,          // the temperature difference across each wall
  temps: null,           // the last temperatures asked for, for that layer
  tempsError: null,      // why they could not be loaded
  overlays: [],          // registered overlays
  on: new Set(),         // overlays switched on
  results: {},           // the last answer of each overlay that is on
  errors: {},            // why an overlay could not be loaded
  timers: {},
};

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c !== null && c !== undefined) node.append(c);
  return node;
}
function svgEl(tag, attrs = {}, text = null) {
  const node = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== null) node.textContent = text;
  return node;
}
const grouped = (s) => s.replace(/^([+-]?)(\d+)/, (m, sign, int) => sign + int.replace(/\B(?=(\d{3})+(?!\d))/g, ","));
const fmt = (v, digits = 0, unit = "") =>
  v === null || v === undefined || isNaN(Number(v)) ? "–" : grouped(Number(v).toFixed(digits)) + unit;
const row = (k, v) => el("div", { class: "row" }, el("span", { class: "k" }, k), el("span", { class: "v" }, v));

function showError(text) {
  const box = document.getElementById("error");
  box.textContent = text || "";
  box.classList.toggle("hidden", !text);
}

/* ---------- choosing what to draw ---------- */

function chip(label, pressed, onclick, title) {
  return el("button", { class: "chip", type: "button", "aria-pressed": String(pressed), title: title || label, onclick }, label);
}

// one thing at a time: a room, a floor or a detached building, or the whole house (both null)
function choose(room, part) {
  state.room = room;
  state.part = part;
  lab.remember("house.room", room);
  lab.remember("house.part", part);
  drawRooms();
  drawParts();
  drawControls();
  loadDrawing();
}

function drawRooms() {
  const choices = [{ area_id: null, name: "Whole house" }, ...state.house.rooms];
  const whole = !state.room && !state.part;
  document.getElementById("rooms").replaceChildren(...choices.map((r) => chip(
    r.name, r.area_id === null ? whole : r.area_id === state.room,
    () => choose(r.area_id, null),
    r.floor ? `${r.name} (${r.floor})` : r.name)));
}

// each named floor, then each detached building, with the rooms it draws
function houseParts() {
  const byFloor = new Map();
  for (const r of state.house.rooms) {
    const name = r.floor || "";
    if (!byFloor.has(name)) byFloor.set(name, { areas: [], level: r.level });
    byFloor.get(name).areas.push(r.area_id);
  }
  const parts = [];
  for (const [name, { areas, level }] of byFloor) {
    if (name) parts.push({ key: `floor:${name}`, label: name, areas, level, title: "A floor" });
  }
  // a building whose rooms are a floor's (a Garage floor, say) already has its button
  const same = (a, b) => a.length === b.length && a.every((x) => b.includes(x));
  for (const b of state.house.buildings || []) {
    if (parts.some((p) => same(p.areas, b.area_ids || []))) continue;
    parts.push({ key: `building:${b.id}`, label: b.title, areas: b.area_ids || [], title: "A detached building" });
  }
  return parts;
}

function drawParts() {
  const bar = document.getElementById("parts");
  const parts = houseParts();
  bar.classList.toggle("hidden", !parts.length);
  bar.replaceChildren(el("span", { class: "label" }, "By Floor"), ...parts.map((p) => {
    const on = p.key === state.part;
    return chip(p.label, on, () => choose(null, on ? null : p.key), p.title);
  }));
}

// where the drawing is seen from, as words, and as the drawing's query
const seenFrom = () => state.topDown
  ? `from above, ${UP_BY_VIEW[state.view]} at the top`
  : `from the ${VIEWS[state.view]}`;
const viewQuery = () => `view=${state.view}&top=${state.topDown ? 1 : 0}`;

function drawControls() {
  const whole = !state.room && !state.part;
  document.getElementById("view-name").textContent = seenFrom();
  for (const b of document.querySelectorAll("#turn button[data-topdown]")) {
    b.setAttribute("aria-pressed", String(b.dataset.topdown === String(state.topDown)));
  }
  // floors and overlays only mean something for the whole house; from above,
  // the floors are always drawn apart
  document.getElementById("floors").classList.toggle("hidden", !whole || state.topDown);
  for (const b of document.querySelectorAll("#floors button")) {
    b.setAttribute("aria-pressed", String(b.dataset.exploded === String(state.exploded)));
  }
  const chips = [el("span", { class: "label" }, "Show"),
    chip("Heating runs", state.runs, () => {
      state.runs = !state.runs; lab.remember("house.runs", state.runs); drawControls(); showLayers();
    }),
    chip("Roofs", state.roofs, () => {
      state.roofs = !state.roofs; lab.remember("house.roofs", state.roofs); drawControls(); showLayers();
    }),
    chip("Dimensions", state.dims, () => {
      state.dims = !state.dims; lab.remember("house.dims", state.dims); drawControls(); showLayers();
    }),
    chip("R-values", state.rvalues, () => {
      state.rvalues = !state.rvalues; lab.remember("house.rvalues", state.rvalues); drawControls(); showLayers();
    }),
    // a room drawn alone has its own arrows to the rooms it links to, and its name on its chip
    state.room ? null : chip("Connections", state.links, () => {
      state.links = !state.links; lab.remember("house.links", state.links); drawControls(); showLayers();
    }, "A line between each two rooms given as next to, above or below each other (dashed: open to each other)"),
    state.room ? null : chip("Room names", state.names, () => {
      state.names = !state.names; lab.remember("house.names", state.names); drawControls(); showLayers();
    }),
    state.room ? null : chip("Positions", state.positions, () => {
      state.positions = !state.positions; lab.remember("house.positions", state.positions); drawControls(); showLayers();
    }, "The origin (the house's south-west corner), and where each room with a typed position is from it; rooms fitted to the others have no pin"),
    // the temperature difference across the walls: needs the rooms' temperature sensors
    chip("Temperature difference", state.delta, toggleDelta,
      "The temperature difference across each wall, with an arrow for the way heat is expected to flow"),
    // the labels can be drawn larger (drawing.py LARGE_TEXT), for a room, a floor or the house
    chip("Large text", state.bigText, () => {
      state.bigText = !state.bigText; lab.remember("house.bigText", state.bigText); drawControls(); loadDrawing();
    }, "Draw the labels (sizes, R-values, temperature differences) larger")];
  if (whole) {
    for (const o of state.overlays) {
      chips.push(chip(o.title, state.on.has(o.key), () => toggleOverlay(o.key)));
    }
  }
  document.getElementById("layers").replaceChildren(...chips.filter(Boolean));
}

/* ---------- the drawing ---------- */

let drawingTicket = 0;
async function loadDrawing() {
  const box = document.getElementById("drawing");
  const hint = document.getElementById("drawing-hint");
  const stamp = Date.now();  // the drawing follows the saved parts, so never cached
  let url;
  const part = state.room ? null : houseParts().find((p) => p.key === state.part) || null;
  if (state.room) {
    const room = state.house.rooms.find((r) => r.area_id === state.room);
    const text = state.bigText ? "large" : "normal";
    url = `/api/house_structure/room.svg?area=${encodeURIComponent(state.room)}&${viewQuery()}&text=${text}&v=${stamp}`;
    box.setAttribute("aria-label", `${room ? room.name : "The room"}, ${seenFrom()}`);
    hint.textContent = `The room from its size and its parts, seen ${seenFrom()}. `
      + "Solid faces are typed walls; dotted are open to a neighbour; dash-dotted share a "
      + "neighbour with no internal wall typed yet; dashed have no wall part yet. "
      + "The dots are the registers' outlets. "
      + "Arrows point to the rooms it links to: beside, open, above or below.";
  } else if (part && part.level != null) {
    // a floor: its rooms, and the stairs that reach it (drawn by the server)
    // its rooms too: another floor (a garage, say) can share its level
    url = `/api/house_structure/plan.svg?level=${part.level}&areas=${encodeURIComponent(part.areas.join(","))}&${viewQuery()}&text=${state.bigText ? "large" : "normal"}&v=${stamp}`;
    box.setAttribute("aria-label", `${part.label}, ${seenFrom()}`);
    hint.textContent = `${part.label} alone, its rooms at their places in the house, seen ${seenFrom()}. `
      + "Stairs to another floor show their flight here, or their opening where they come up to this floor. "
      + "The heating runs go from the plenum to each register in it; they are schematic.";
  } else if (part) {
    url = `/api/house_structure/plan.svg?areas=${encodeURIComponent(part.areas.join(","))}&${viewQuery()}&text=${state.bigText ? "large" : "normal"}&v=${stamp}`;
    box.setAttribute("aria-label", `${part.label}, ${seenFrom()}`);
    hint.textContent = `${part.label} alone, its rooms at their places in the house, seen ${seenFrom()}. `
      + "The heating runs go from the plenum to each register in it; they are schematic.";
  } else {
    // from above, the floors are always apart (the server draws them so)
    const apart = state.exploded || state.topDown;
    url = `/api/house_structure/plan.svg?exploded=${state.exploded ? 1 : 0}&${viewQuery()}&text=${state.bigText ? "large" : "normal"}&v=${stamp}`;
    box.setAttribute("aria-label", (apart
      ? "The house, drawn from its rooms with the floors pulled apart"
      : "The house, drawn from its rooms") + `, ${seenFrom()}`);
    hint.textContent = (apart
      ? "The floors apart, one above the other up the page, so each can be seen. "
      : "The rooms fitted together, each floor over the one below. ")
      + "The heating runs go from the plenum to each register; they are schematic.";
  }
  const ticket = ++drawingTicket;
  box.classList.add("busy");
  box.setAttribute("aria-busy", "true");
  let text;
  try {
    const response = await fetch(url, { cache: "no-store" });
    if (!response.ok) throw new Error(String(response.status));
    text = await response.text();
  } catch (err) {
    if (ticket !== drawingTicket) return;
    box.classList.remove("busy");
    box.removeAttribute("aria-busy");
    box.replaceChildren();
    hint.textContent = "Nothing to draw yet: give the rooms their sizes.";
    return;
  }
  if (ticket !== drawingTicket) return;  // a newer choice was made meanwhile
  box.classList.remove("busy");
  box.removeAttribute("aria-busy");
  // our own server's drawing, with every name escaped (drawing.py)
  const doc = new DOMParser().parseFromString(text, "image/svg+xml");
  const svg = doc.documentElement;
  if (svg.nodeName !== "svg") { box.replaceChildren(); return; }
  captionNotes = takeCaptions(svg);
  box.replaceChildren(document.importNode(svg, true));
  showLayers();
  drawOverlays();
}

// the drawing's notes (drawing.py) are shown as text under it, not inside the picture:
// they are taken out of the picture, which is cut to its drawing
let captionNotes = [];
function takeCaptions(svg) {
  const captions = svg.querySelector('[data-layer="notes"]');
  if (!captions) return [];
  const notes = [...captions.querySelectorAll("text")].map((t) => t.getAttribute("data-note") || "");
  const height = String(Number(svg.getAttribute("data-drawing-height")));
  svg.setAttribute("viewBox", `0 0 ${svg.getAttribute("width")} ${height}`);
  svg.setAttribute("height", height);
  svg.querySelector(":scope > rect").setAttribute("height", height);
  captions.remove();
  return notes;
}

function currentSvg() {
  return document.querySelector("#drawing svg");
}

function showLayers() {
  const svg = currentSvg();
  if (!svg) return;
  for (const g of svg.querySelectorAll('[data-layer="runs"]')) {
    g.style.display = state.runs ? "" : "none";
  }
  for (const g of svg.querySelectorAll('[data-layer="roofs"]')) {
    g.style.display = state.roofs ? "" : "none";
  }
  for (const g of svg.querySelectorAll('[data-layer="dims"]')) {
    g.style.display = state.dims ? "" : "none";
  }
  for (const g of svg.querySelectorAll('[data-layer="rvalues"]')) {
    g.style.display = state.rvalues ? "" : "none";
  }
  for (const g of svg.querySelectorAll('[data-layer="connections"]')) {
    g.style.display = state.links ? "" : "none";
  }
  for (const g of svg.querySelectorAll('[data-layer="names"]')) {
    g.style.display = state.names ? "" : "none";
  }
  for (const g of svg.querySelectorAll('[data-layer="positions"]')) {
    g.style.display = state.positions ? "" : "none";
  }
  // a roof's R-value goes with the roofs as well as with the R-values
  for (const g of svg.querySelectorAll('[data-layer="roofvalues"]')) {
    g.style.display = state.roofs && state.rvalues ? "" : "none";
  }
}

/* ---------- overlays ---------- */

function anchors(svg) {
  const out = { room: {}, between: {}, toward: {}, outside: {}, register: {} };
  for (const c of svg.querySelectorAll('[data-layer="anchors"] circle')) {
    const point = [Number(c.getAttribute("cx")), Number(c.getAttribute("cy"))];
    const d = c.dataset;
    if (d.register) out.register[d.register] = { point, room: d.room };
    // a stairs room has a point on each floor it occupies: the first (its flight) is its centre
    else if (d.room && !(d.room in out.room)) out.room[d.room] = point;
    if (d.between) out.between[d.between] = point;
    if (d.toward) out.toward[d.toward] = point;
    if (d.outside) out.outside[d.outside] = point;
  }
  return out;
}

const pair = (a, b) => [a, b].sort().join("|");

/* The way from room a to room b across the wall (or floor) between them: square across the wall
 * where the drawing gives a point past it (on the side of the pair's second room), else from one
 * room's middle to the other's. Null when there is no way to tell. */
function across(where, a, b) {
  const key = pair(a, b);
  const at = where.between[key], past = where.toward[key];
  if (at && past) {
    const dir = unit(past[0] - at[0], past[1] - at[1]);
    if (dir) return key.startsWith(`${a}|`) ? dir : [-dir[0], -dir[1]];
  }
  const pa = where.room[a], pb = where.room[b];
  return pa && pb ? unit(pb[0] - pa[0], pb[1] - pa[1]) : null;
}
function unit(dx, dy) {
  const n = Math.hypot(dx, dy);
  return n > 1e-6 ? [dx / n, dy / n] : null;
}

// the middle of the rooms drawn: the average of their centres (null when there are none)
function houseCentre(rooms) {
  const pts = Object.values(rooms);
  if (!pts.length) return null;
  return [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length];
}

const LABEL_SIZE = 11;  // px
function label(g, x, y, text, colour) {
  g.append(svgEl("text", {
    x: x.toFixed(1), y: y.toFixed(1), fill: colour, "font-size": String(LABEL_SIZE), "font-weight": "600",
    "text-anchor": "middle", stroke: "#ffffff", "stroke-width": "3", "paint-order": "stroke",
  }, text));
}

/* The drawing's edges run at 30°, 90° and 150° on the page (drawing.py project), and an
 * arrow through the middle of a wall points along one of them, so it would lie on the
 * room's lines. One that near an edge's angle is turned to half way to the next edge's
 * (30° off), whichever way points more up the page. */
const EDGE_ANGLES = [30, 90, 150];
const EDGE_NEAR = 12;  // degrees
function offEdges([dx, dy]) {
  const angle = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 180;
  if (!EDGE_ANGLES.some((e) => Math.abs(angle - e) < EDGE_NEAR)) return [dx, dy];
  const turned = [30, -30].map((deg) => {
    const r = deg * Math.PI / 180;
    return [dx * Math.cos(r) - dy * Math.sin(r), dx * Math.sin(r) + dy * Math.cos(r)];
  });
  return turned[0][1] <= turned[1][1] ? turned[0] : turned[1];
}

/* An arrow centred on (x, y) pointing along (dx, dy), its weight by its share of the largest flow,
 * its label just past its tip. */
function arrow(g, [x, y], dir, share, colour, text) {
  const [dx, dy] = offEdges(dir);
  const length = 16 + 14 * share;
  const width = 1.5 + 4 * share;
  const head = 5 + 3 * share;
  const x0 = x - dx * length / 2, y0 = y - dy * length / 2;
  const x1 = x + dx * length / 2, y1 = y + dy * length / 2;
  const bx = x1 - dx * head, by = y1 - dy * head;
  g.append(svgEl("line", {
    x1: x0.toFixed(1), y1: y0.toFixed(1), x2: bx.toFixed(1), y2: by.toFixed(1),
    stroke: colour, "stroke-width": width.toFixed(1), "stroke-linecap": "round",
  }));
  const px = -dy * head * 0.7, py = dx * head * 0.7;
  g.append(svgEl("polygon", {
    points: [[x1, y1], [bx + px, by + py], [bx - px, by - py]].map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" "),
    fill: colour,
  }));
  // the label just past the tip, its box clear of it whichever way the arrow points
  const halfW = 0.62 * LABEL_SIZE * text.length / 2, halfH = 0.6 * LABEL_SIZE;
  const past = 4 + Math.abs(dx) * halfW + Math.abs(dy) * halfH;
  label(g, x1 + dx * past, y1 + dy * past + 0.35 * LABEL_SIZE, text, colour);
}

function glyph(g, [x, y], symbol, text, colour) {
  g.append(svgEl("text", { x: x.toFixed(1), y: (y + 5).toFixed(1), "font-size": "15", "text-anchor": "middle" }, symbol));
  label(g, x, y + 19, text, colour);
}

const watts = (w) => `${fmt(Math.abs(w))} W`;

function drawOverlay(svg, key, data) {
  const where = anchors(svg);
  const g = svgEl("g", { "data-layer": `overlay-${key}` });
  const flows = [...(data.between || []), ...(data.outside || []), ...(data.heating || []), ...(data.solar || [])];
  const largest = Math.max(1, ...flows.map((f) => Math.abs(Number(f.w) || 0)));
  const share = (w) => Math.sqrt(Math.min(Math.abs(w) / largest, 1));
  let missed = 0;

  for (const f of data.between || []) {
    const at = where.between[pair(f.from, f.to)];
    const dir = at ? across(where, f.from, f.to) : null;
    if (!dir) { missed++; continue; }
    const w = Number(f.w) || 0;
    arrow(g, at, w >= 0 ? dir : [-dir[0], -dir[1]], share(w), COLOURS.between, watts(w));
  }
  for (const f of data.outside || []) {
    const at = where.outside[`${f.room}|${f.face}`];
    const c = where.room[f.room];
    const out = at && c ? unit(at[0] - c[0], at[1] - c[1]) : null;
    if (!out) { missed++; continue; }
    const w = Number(f.w) || 0;  // positive: into the room
    arrow(g, at, w >= 0 ? [-out[0], -out[1]] : out, share(w), w >= 0 ? COLOURS.gain : COLOURS.loss, watts(w));
  }
  for (const f of data.heating || []) {
    let points = [];
    if (f.register && where.register[f.register]) points = [where.register[f.register].point];
    else points = Object.values(where.register).filter((r) => r.room === f.room).map((r) => r.point);
    if (!points.length && where.room[f.room]) points = [where.room[f.room]];
    if (!points.length) { missed++; continue; }
    // shared over the room's outlets when the overlay names none
    const each = (Number(f.w) || 0) / points.length;
    for (const p of points) glyph(g, p, "🔥", watts(each), COLOURS.heat);
  }
  for (const f of data.solar || []) {
    const c = where.room[f.room];
    if (!c) { missed++; continue; }
    glyph(g, [c[0], c[1] - 14], "☀", watts(f.w), COLOURS.sun);
  }
  const notes = svg.querySelector('[data-layer="notes"]');
  svg.insertBefore(g, notes);  // over the drawing, under nothing
  return missed;
}

/* ---------- temperature difference ---------- */

const DELTA_MIN = 0.05;  // °C: a smaller difference is shown as no flow

/* An arrow across each wall rooms share, and one for each room's outside, from the warmer side to
 * the cooler: heat flows down the temperature, so that is the way energy is expected to go.
 * Weight by the share of the largest difference. Returns how many walls had no reading
 * or no place on the drawing. */
function drawDelta(svg, data) {
  const where = anchors(svg);
  const g = svgEl("g", { "data-layer": "overlay-delta" });
  const scale = data.unit === "°F" ? 1.8 : 1;
  const unitName = data.unit || "°C";
  const rooms = data.rooms || {};
  const walls = [];
  let missed = 0;
  for (const [key, at] of Object.entries(where.between)) {
    const [a, b] = key.split("|");
    const ta = rooms[a], tb = rooms[b];
    if (ta == null || tb == null) continue;  // a room with no sensor: nothing to show
    const dir = across(where, a, b);
    if (!dir) { missed++; continue; }
    const d = ta - tb;  // positive: from a to b
    walls.push({ at, d, dir: d >= 0 ? dir : [-dir[0], -dir[1]], colour: COLOURS.between });
  }
  if (data.outside != null) {
    // one arrow per room, not per outside wall: the outside is the same on every wall, so
    // the room's arrow hangs on the outside wall that faces furthest away from the middle
    // of the house, and points out through it
    const centre = houseCentre(where.room);
    const byRoom = {};
    for (const [key, at] of Object.entries(where.outside)) {
      const room = key.split("|")[0];
      const c = where.room[room];
      const out = c ? unit(at[0] - c[0], at[1] - c[1]) : null;
      if (!out) { missed++; continue; }
      (byRoom[room] ||= []).push({ at, out });
    }
    for (const [room, faces] of Object.entries(byRoom)) {
      const t = rooms[room];
      if (t == null) continue;
      const away = centre && unit(where.room[room][0] - centre[0], where.room[room][1] - centre[1]);
      const best = away
        ? faces.reduce((a, b) => (b.out[0] * away[0] + b.out[1] * away[1] > a.out[0] * away[0] + a.out[1] * away[1] ? b : a))
        : faces[0];
      const d = t - data.outside;  // positive: out of the room
      const dir = d >= 0 ? best.out : [-best.out[0], -best.out[1]];
      walls.push({ at: best.at, d, dir, colour: d >= 0 ? COLOURS.loss : COLOURS.gain });
    }
  }
  const largest = Math.max(DELTA_MIN, ...walls.map((w) => Math.abs(w.d)));
  for (const w of walls) {
    const text = `${fmt(Math.abs(w.d) * scale, 1)} ${unitName}`;
    if (Math.abs(w.d) < DELTA_MIN) { label(g, w.at[0], w.at[1] + 4, text, "#555555"); continue; }
    arrow(g, w.at, w.dir, Math.sqrt(Math.abs(w.d) / largest), w.colour, text);
  }
  const notes = svg.querySelector('[data-layer="notes"]');
  svg.insertBefore(g, notes);
  return { missed, outside: data.outside != null, drawn: walls.length };
}

async function fetchTemps() {
  if (!state.delta) return;
  try {
    state.temps = await lab.ask({ type: "house_structure/temperatures" });
    state.tempsError = null;
  } catch (err) {
    state.tempsError = "could not load (" + (err && (err.message || err.code) || err) + ")";
  }
  drawOverlays();
}

function startDelta() {
  clearInterval(state.timers._delta);
  fetchTemps();
  state.timers._delta = setInterval(fetchTemps, 60 * 1000);
}

function toggleDelta() {
  state.delta = !state.delta;
  lab.remember("house.delta", state.delta);
  if (state.delta) startDelta();
  else { clearInterval(state.timers._delta); delete state.timers._delta; state.temps = null; }
  drawControls();
  drawOverlays();
}

function drawOverlays() {
  const svg = currentSvg();
  const list = document.getElementById("overlay-notes");
  if (!svg) { list.replaceChildren(); return; }
  for (const g of svg.querySelectorAll('[data-layer^="overlay-"]')) g.remove();
  const notes = [...captionNotes];
  if (state.delta) {
    if (state.tempsError) notes.push(`Temperature difference: ${state.tempsError}`);
    else if (!state.temps) notes.push("Temperature difference: loading…");
    else {
      const shown = drawDelta(svg, state.temps);
      notes.push("Temperature difference: an arrow across each wall from the warmer side to the cooler, "
        + "the way heat is expected to flow (through a wall between rooms, or to or from outside). "
        + "A wall is left out when a room has no temperature sensor."
        + (state.room ? " A room beside, above or below is not drawn, but its wall (or floor, or ceiling) has its arrow." : ""));
      if (!shown.outside) notes.push("Temperature difference: no outside temperature (needs a weather entity), so the outside walls are left out.");
      if (!shown.drawn) notes.push("Temperature difference: no wall has temperatures on both sides yet.");
      if (shown.missed) notes.push(`Temperature difference: ${shown.missed} wall${shown.missed === 1 ? "" : "s"} with no place on the drawing.`);
    }
  }
  if (!state.room && !state.part) {
    for (const o of state.overlays) {
      if (!state.on.has(o.key)) continue;
      if (state.errors[o.key]) { notes.push(`${o.title}: ${state.errors[o.key]}`); continue; }
      const data = state.results[o.key];
      if (!data) { notes.push(`${o.title}: loading…`); continue; }
      const missed = drawOverlay(svg, o.key, data);
      const when = data.as_of ? new Date(data.as_of) : null;
      if (when && !isNaN(when)) {
        notes.push(`${o.title}, as of ${when.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}.`);
      }
      if (missed) notes.push(`${o.title}: ${missed} value${missed === 1 ? "" : "s"} with no place on the drawing (a room not drawn, or rooms that don't touch).`);
      for (const n of data.notes || []) notes.push(`${o.title}: ${n}`);
    }
  }
  list.replaceChildren(...notes.map((n) => el("li", {}, n)));
}

async function fetchOverlay(key) {
  const o = state.overlays.find((x) => x.key === key);
  if (!o || !state.on.has(key)) return;
  try {
    state.results[key] = await lab.ask({ type: o.command });
    delete state.errors[key];
  } catch (err) {
    state.errors[key] = "could not load (" + (err && (err.message || err.code) || err) + ")";
  }
  drawOverlays();
}

function startOverlay(o) {
  clearInterval(state.timers[o.key]);
  fetchOverlay(o.key);
  state.timers[o.key] = setInterval(() => fetchOverlay(o.key), o.refresh_s * 1000);
}

function stopOverlay(key) {
  clearInterval(state.timers[key]);
  delete state.timers[key];
  delete state.results[key];
  delete state.errors[key];
}

function toggleOverlay(key) {
  const o = state.overlays.find((x) => x.key === key);
  if (state.on.has(key)) { state.on.delete(key); stopOverlay(key); }
  else if (o) { state.on.add(key); startOverlay(o); }
  lab.remember("house.overlays", [...state.on]);
  drawControls();
  drawOverlays();
}

function overlaysChanged(list) {
  state.overlays = list || [];
  const known = new Set(state.overlays.map((o) => o.key));
  for (const key of [...state.on]) {
    if (!known.has(key)) stopOverlay(key);  // kept on, in case it comes back
  }
  for (const o of state.overlays) {
    if (state.on.has(o.key) && !state.timers[o.key]) startOverlay(o);
  }
  drawControls();
  drawOverlays();
}

/* ---------- equipment ---------- */

function blower(points) {
  if (!points || !points.length) return "–";
  return points.map(([flow, pa]) => `${fmt(flow / CFM)} cfm = ${fmt(pa / INWC, 2)} inWC`).join(", ");
}

function drawEquipment() {
  const { equipment, names } = state.house;
  const room = (id) => (id ? names[id] || id : "–");
  const parts = [];
  for (const f of equipment.furnaces || []) {
    parts.push(el("div", { class: "part" }, el("h3", {}, f.title),
      row("Room", room(f.area_id)),
      row("Input, high", `${fmt(f.input_high_w / W_PER_BTUH)} BTU/h (${fmt(f.input_high_w / 1000, 1)} kW)`),
      row("Input, low", f.input_low_w ? `${fmt(f.input_low_w / W_PER_BTUH)} BTU/h` : "one stage"),
      row("AFUE", f.afue ? fmt(f.afue * 100, 1, "%") : "not given"),
      row("Blower", blower(f.blower))));
  }
  for (const a of equipment.air_conditioners || []) {
    parts.push(el("div", { class: "part" }, el("h3", {}, a.title),
      row("Room", room(a.area_id)),
      row("Size", `${fmt(a.total_w / W_PER_TON, 1)} tons (${fmt(a.total_w / W_PER_BTUH)} BTU/h)`),
      row("Sensible", a.sensible_w ? `${fmt(a.sensible_w / W_PER_BTUH)} BTU/h` : "not given")));
  }
  if (!parts.length) {
    // the tab sits in a frame that may not navigate the page, so the link opens a new tab
    parts.push(el("p", { class: "hint" },
      "No furnace or air conditioner yet: add them on the ",
      el("a", { href: "/config/integrations/integration/house_structure", target: "_blank", rel: "noopener" }, "House Structure"),
      " integration page."));
  }
  document.getElementById("equipment").replaceChildren(...parts);

  const buildings = state.house.buildings || [];
  document.getElementById("buildings-card").classList.toggle("hidden", !buildings.length);
  document.getElementById("buildings").replaceChildren(...buildings.map((b) =>
    el("div", { class: "part" }, el("h3", {}, b.title), row("Rooms", b.rooms.join(", ") || "–"))));
}

/* ---------- start ---------- */

async function load() {
  try {
    state.house = await lab.ask({ type: "house_structure/house" });
    showError("");
  } catch (err) {
    showError("Could not load the house: " + (err && (err.message || err.code) || err));
    return;
  }
  const saved = lab.recall("house.room", null);
  state.room = state.house.rooms.some((r) => r.area_id === saved) ? saved : null;
  const savedPart = lab.recall("house.part", null);
  state.part = !state.room && houseParts().some((p) => p.key === savedPart) ? savedPart : null;
  drawRooms();
  drawParts();
  drawControls();
  drawEquipment();
  await loadDrawing();
}

for (const b of document.querySelectorAll("#floors button")) {
  b.addEventListener("click", () => {
    state.exploded = b.dataset.exploded === "true";
    lab.remember("house.exploded", state.exploded);
    drawControls();
    loadDrawing();
  });
}
for (const b of document.querySelectorAll("#turn button[data-turn]")) {
  b.addEventListener("click", () => {
    state.view = (state.view + Number(b.dataset.turn) + 4) % 4;
    lab.remember("house.view", state.view);
    drawControls();
    loadDrawing();
  });
}
for (const b of document.querySelectorAll("#turn button[data-topdown]")) {
  b.addEventListener("click", () => {
    state.topDown = b.dataset.topdown === "true";
    lab.remember("house.topDown", state.topDown);
    drawControls();
    loadDrawing();
  });
}
state.topDown = lab.recall("house.topDown", false) === true;
state.exploded = lab.recall("house.exploded", false) === true;
state.view = [0, 1, 2, 3].includes(lab.recall("house.view", 0)) ? lab.recall("house.view", 0) : 0;
state.runs = lab.recall("house.runs", true) !== false;
state.roofs = lab.recall("house.roofs", false) === true;
state.dims = lab.recall("house.dims", false) === true;
state.rvalues = lab.recall("house.rvalues", false) === true;
state.links = lab.recall("house.links", false) === true;
state.names = lab.recall("house.names", false) === true;
state.positions = lab.recall("house.positions", false) === true;
state.delta = lab.recall("house.delta", false) === true;
state.bigText = lab.recall("house.bigText", true) !== false;
state.on = new Set(lab.recall("house.overlays", []));
lab.applyTheme();
if (state.delta) startDelta();
load().then(() => lab.subscribe((event) => overlaysChanged(event.overlays), { type: "house_structure/overlays" })
  .catch(() => { /* no overlays without the subscription */ }));
</script>
</body>
</html>
